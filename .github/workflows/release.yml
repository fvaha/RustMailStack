name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Pinned versions
        run: grep -E '^[A-Z_]+=' versions.env | sed 's/[[:space:]]*#.*$//' >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools nodejs npm pkg-config
          rustup target add ${{ matrix.target }}

      - name: Build the IRIS fork at ${{ env.IRIS_REF }} (static, arch-specific)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          git init -q /tmp/iris
          git -C /tmp/iris remote add origin "https://github.com/${IRIS_REPO}.git"
          git -C /tmp/iris fetch -q --depth 1 origin "${IRIS_REF}"
          git -C /tmp/iris checkout -q FETCH_HEAD
          ( cd /tmp/iris/apps/web && npm ci && npm run build )
          case "$TARGET" in
            x86_64-*)  export CC_x86_64_unknown_linux_musl=musl-gcc AR_x86_64_unknown_linux_musl=ar ;;
            aarch64-*) export CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc AR_aarch64_unknown_linux_musl=ar ;;
          esac
          ( cd /tmp/iris && cargo build --release --target "$TARGET" -p iris-api )
          mkdir -p artefacts
          cp "/tmp/iris/target/$TARGET/release/iris-api" "artefacts/iris-api-${{ matrix.arch }}"
          tar -C /tmp/iris/apps/web -czf artefacts/iris-dist.tgz dist

      - name: Assemble payload
        run: ARCH=${{ matrix.arch }} ./build/build-payload.sh

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/deb/DEBIAN
          sed -e "s/@VERSION@/$VERSION/" -e "s/@ARCH@/${{ matrix.arch }}/" debian/control > build/deb/DEBIAN/control
          cp debian/postinst debian/prerm build/deb/DEBIAN/
          chmod 0755 build/deb/DEBIAN/postinst build/deb/DEBIAN/prerm
          cp -a build/root/. build/deb/
          dpkg-deb --build --root-owner-group build/deb "rustmailstack_${VERSION}_${{ matrix.arch }}.deb"

      - name: Build portable tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C build/root -czf "rustmailstack-${VERSION}-${{ matrix.arch }}.tar.gz" .

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rustmailstack_*.deb
            rustmailstack-*.tar.gz
